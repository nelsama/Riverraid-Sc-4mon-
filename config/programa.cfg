# programa.cfg - Configuración del linker para programas en C
# Carga en $0800 para ejecutar desde el Monitor 6502
# Plantilla optimizada para programas pequeños usando ROM API

SYMBOLS {
    # Stack COMPLETO de 512 bytes ($3E00-$3FFF).
    #
    # ESTO NO SE TOCA. Cuando el programa no cabia se recorto el stack para
    # hacerle sitio y el fondo del stack acabo POR DEBAJO del final de BSS: las
    # llamadas hondas pisaban river_l/r, ene_next y el estado del generador. De
    # ahi venian los bugs "aleatorios": enemigos que se movian cuando la tabla
    # decia quietos, choques contra algo invisible y gen_sector disparado a
    # miles. Se libera RAM quitando codigo y datos, NUNCA el stack.
    #
    # Estado actual: BSS acaba en $3E06 y el stack empieza en $3E00 -> 10 bytes
    # de hueco. El SP medido baja hasta ~$3EE9, o sea que se usan ~20 bytes.
    __STACKSIZE__: type = weak, value = $01FF;         # 511 bytes de stack
    __STACKSTART__: type = weak, value = $3E00;        # Stack en $3E01-$3FFF
    
    # Símbolos requeridos por el runtime C
    __CONSTRUCTOR_COUNT__: type = weak, value = 0;
    __DESTRUCTOR_COUNT__: type = weak, value = 0;
    __CONSTRUCTOR_TABLE__: type = weak, value = $0800;
    __DESTRUCTOR_TABLE__: type = weak, value = $0800;
}

MEMORY {
    # Zero Page: usar $20-$7F para no conflictuar con el monitor ($02-$1F).
    # Dentro de este rango conviven:
    #   - La ZP del driver de video (video.o): $20-$2E aprox.
    #   - La ZP del runtime CC65 (zeropage.o): a continuacion.
    # El linker reparte ambos sin solape.
    ZP:  start = $0020, size = $0060, type = rw, define = yes;
    
    # RAM para el programa: $0800-$3DFF (el stack ocupa $3E00-$3FFF)
    RAM: start = $0800, size = $3600, type = rw, file = %O, define = yes;
    
    # Stack area: $3E00-$3FFF (512 bytes)
    STACK: start = $3E00, size = $0200, type = rw, define = yes;
}

SEGMENTS {
    # Zero Page para variables
    ZEROPAGE: load = ZP, type = zp, define = yes;
    
    # Código principal (inicia en $0800)
    STARTUP:  load = RAM, type = ro;
    
    # Código adicional
    CODE:     load = RAM, type = ro, optional = yes;
    
    # Código de inicialización (ejecutado una vez)
    ONCE:     load = RAM, type = ro, optional = yes;
    
    # Datos de solo lectura (tablas, strings)
    RODATA:   load = RAM, type = ro, optional = yes;
    
    # Datos inicializados
    DATA:     load = RAM, type = rw, define = yes, optional = yes;
    
    # Datos sin inicializar
    BSS:      load = RAM, type = bss, define = yes, optional = yes;
}
